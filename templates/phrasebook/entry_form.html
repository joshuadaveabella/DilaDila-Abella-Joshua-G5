{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card auth-card wide">
  <h1>{{ title }}</h1>
  <p class="muted">Pick a phrase from the library, type your own, or both.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <div class="actions">
      <button type="submit" class="btn">Save entry</button>
      <a class="btn btn-ghost" href="{% url 'phrasebook:my_phrasebook' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
