{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card auth-card wide">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <div class="actions">
      <button type="submit" class="btn">Save phrase</button>
      <a class="btn btn-ghost" href="{% url 'library:manage_phrases' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
