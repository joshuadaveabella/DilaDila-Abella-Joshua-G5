{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<section class="card auth-card center">
  <h1>Delete this {{ kind }}?</h1>
  <p><strong>{{ object_name }}</strong> will be permanently removed. This cannot be undone.</p>
  <form method="post" class="actions" style="justify-content:center">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a class="btn btn-ghost" href="{{ cancel_url }}">Cancel</a>
  </form>
</section>
{% endblock %}
