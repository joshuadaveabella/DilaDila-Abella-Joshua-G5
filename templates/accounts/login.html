{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to continue learning Bisaya.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted center"><a href="{% url 'accounts:password_reset' %}">Forgot your password?</a></p>
  <p class="muted center">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
</section>
{% endblock %}
