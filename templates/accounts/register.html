{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Create your account</h1>
  <p class="muted">Start learning everyday Bisaya for campus life.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <button type="submit" class="btn">Sign up</button>
  </form>
  <p class="muted center">Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
</section>
{% endblock %}
